<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Management System</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="container">


        <!-- HEADER -->

        <header>

            <h1>Inventory Management System</h1>

            <p>
                Manage your products and stock easily
            </p>

        </header>



        <!-- DASHBOARD -->

        <section class="dashboard">

            <div class="dashboard-card">

                <h3>Total Products</h3>

                <p id="totalProducts">0</p>

            </div>


            <div class="dashboard-card">

                <h3>Total Stock</h3>

                <p id="totalStock">0</p>

            </div>


            <div class="dashboard-card">

                <h3>Low Stock</h3>

                <p id="lowStock">0</p>

            </div>


            <div class="dashboard-card">

                <h3>Out of Stock</h3>

                <p id="outOfStock">0</p>

            </div>

        </section>



        <!-- ADD PRODUCT -->

        <section class="card">

            <h2>Add Product</h2>


            <form id="productForm">

                <input
                    type="text"
                    id="product_id"
                    placeholder="Product ID"
                    required
                >

                <input
                    type="text"
                    id="name"
                    placeholder="Product Name"
                    required
                >

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    required
                >

                <input
                    type="number"
                    id="quantity"
                    placeholder="Quantity"
                    min="0"
                    required
                >

                <input
                    type="number"
                    id="price"
                    placeholder="Price"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Add Product
                </button>

            </form>


            <p id="message"></p>

        </section>



        <!-- PRODUCT LIST -->

        <section class="card">

            <div class="section-header">

                <h2>Product List</h2>

                <div class="search-area">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by ID, name or category..."
                        oninput="searchProducts()"
                    >

                    <button onclick="loadProducts()">
                        Refresh
                    </button>

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Product ID</th>

                            <th>Product</th>

                            <th>Category</th>

                            <th>Quantity</th>

                            <th>Price</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="productTable">

                    </tbody>

                </table>

            </div>

        </section>


    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}">
    </script>


</body>

</html>
